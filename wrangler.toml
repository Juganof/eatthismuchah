name = "ah-macro-planner"
main = "src/index.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

# Veel kleine rondes in plaats van één grote 's nachts. ah.nl staat achter
# Akamai en reageert op tempo, niet op aantallen: een grote ingest loopt
# gegarandeerd tegen 403's aan, terwijl kleine rondes met rust ertussen er wel
# doorkomen. Het tempo zélf zit in AUTO_MIN_INTERVAL_MS (nu gedeeld over alle
# aanroepen, zie src/ah/client.ts) — hoe vaak de cron aftrapt is daar los van:
# een ronde van 8 recepten duurt ruim op zijn tempo een seconde of 10, dus elke
# 2 minuten laat ruim voldoende lucht. Zie src/ingest/auto.ts.
[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ah-macro-planner"
database_id = "c05c3aa9-97b5-4c93-8208-5ea1ce6d8248"

[vars]
# Outgoing identity used for every ah.nl / api.ah.nl request.
AH_USER_AGENT = "Appie/8.22.3 Model/phone Android/13-M"
# Comma-separated recipe search terms used by the nightly cron ingest.
INGEST_QUERIES = "kip,zalm,pasta,vegetarisch,rijst,salade"
# How many recipes a handmatige ingest ophaalt per aanroep.
INGEST_LIMIT = "40"

# --- automatisch bijvullen -------------------------------------------------
# Recepten per automatische ronde. Eén verzoek per recept, dus dit is vooral
# begrensd door de tijd: met 700 ms ertussen duurt een ronde van 30 recepten
# ruim 20 seconden, en dat past binnen een cron-aanroep.
AUTO_BATCH = "30"
# Bovengrens per dag, zodat de automaat niet eindeloos doorhamert.
AUTO_DAILY_MAX = "250"
# Minimale rust tussen twee verzoeken aan ah.nl.
AUTO_MIN_INTERVAL_MS = "700"
# Hoe lang er niets gebeurt nadat AH ons geblokkeerd heeft.
AUTO_COOLDOWN_MS = "1800000"
# Bovengrens voor de afkoelperiode: blokkeert AH ons meteen weer zodra we het
# opnieuw proberen, dan verdubbelt AUTO_COOLDOWN_MS elke keer tot hier aan toe.
AUTO_MAX_COOLDOWN_MS = "14400000"

# --- productverrijking -----------------------------------------------------
# Haalt na het opslaan van een recept de echte AH-producten per ingrediënt op
# (via /gql): voedingswaarde per 100 g voor de planner en productlinks voor de
# boodschappenlijst. Kost één verzoek voor de suggesties plus één per uniek
# product, dus begrensd per ronde — zie src/ingest/enrich.ts.
ENRICH_ENABLED = "0"
# Maximaal aantal recepten dat één ronde verrijkt.
ENRICH_RECIPES_PER_RUN = "3"
